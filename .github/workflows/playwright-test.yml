name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to test"
        required: true
        default: "main"
        type: string

jobs:
  run-playwright-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Create allure-results directory
        run: mkdir -p allure-results

      - name: Pull Docker image from Docker Hub
        run: docker pull sbpy/playwright-tests:latest

      - name: Run Playwright tests with sharding
        run: |
          # Jalankan 4 shard secara berurutan (bukan paralel)
          for shard in 1 2 3 4; do
            docker run --rm \
              -v ${{ github.workspace }}/allure-results:/app/allure-results \
              -v ${{ github.workspace }}/tests:/app/tests \
              -v ${{ github.workspace }}/src:/app/src \
              -v ${{ github.workspace }}/setup:/app/setup \
              -v ${{ github.workspace }}/reporter:/app/reporter \
              -v ${{ github.workspace }}/playwright.config.ts:/app/playwright.config.ts \
              sbpy/playwright-tests:latest \
              sh -c "npx playwright test --shard=$shard/4 --reporter=line || true"
          done

      - name: List results (debugging)
        run: ls -la allure-results/

      - name: Upload Allure Results as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}
          path: allure-results/
          retention-days: 7

      - name: Test status
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            echo "✅ Tests completed with results"
          else
            echo "⚠️ No test results found"
          fi