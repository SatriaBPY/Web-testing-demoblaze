jobs:
  run-tests:
    name: Run - ${{ github.event.inputs.trigger_id }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
    
      - name: Prepare Allure Folder
        run: mkdir -p allure-results
    
      - name: Pull Docker Image
        run: docker pull sbpy/playwright-tests:latest
    
      - name: Run Playwright (Hybrid Mode)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            sbpy/playwright-tests:latest
    
      - name: Debug Results
        run: ls -la allure-results || true
    
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: allure-results/
      
      - name: Test status
        run: |
           if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
             echo "✅ Tests completed with results"
           else
             echo "⚠️ No test results found"
           fi